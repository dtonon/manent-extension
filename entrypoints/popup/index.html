<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manent</title>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="appbar">
      <span class="appbar-title">MANENT</span>
    </header>

    <section id="login" class="screen" hidden>
      <h2>Login</h2>
      <label for="login-key">Private key (nsec, hex or ncryptsec)</label>
      <input id="login-key" class="input" type="password" autocomplete="off" />
      <label for="login-password">Password (optional, encrypts the key)</label>
      <input id="login-password" class="input" type="password" autocomplete="off" />
      <button id="login-btn" class="btn">Login</button>
      <button id="nip07-btn" class="btn">Use signer extension (NIP-07)</button>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <section id="unlock" class="screen" hidden>
      <h2>Unlock</h2>
      <label for="unlock-password">Password</label>
      <input id="unlock-password" class="input" type="password" autocomplete="off" />
      <button id="unlock-btn" class="btn">Unlock</button>
      <p id="unlock-error" class="error" role="alert"></p>
    </section>

    <section id="main" class="screen" hidden>
      <p id="tab-info"></p>
      <label for="comment">Comment (optional)</label>
      <textarea id="comment" class="input" rows="3"></textarea>
      <label for="tags">Tags (added at the bottom of the note)</label>
      <input id="tags" class="input" type="text" />
      <label><input type="checkbox" id="sensitive" /> Sensitive</label>
      <button id="save-btn" class="btn">Save current page</button>
      <button id="save-article-btn" class="btn">Save full article</button>
      <p role="status"><span id="save-spinner" class="spinner" hidden></span> <span id="save-status"></span></p>
      <hr />
      <h3>Recent saves</h3>
      <ul id="recent"></ul>
      <p id="pending-info"></p>
      <p><a id="manent-link" href="https://manent.dtonon.com" target="_blank">Open Manent</a></p>
      <hr />
      <h3>Relays</h3>
      <ul id="relays"></ul>
      <h3>Blossom servers</h3>
      <ul id="blossom"></ul>
      <hr />
      <p id="whoami"></p>
      <button id="logout-btn" class="btn">Logout</button>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
