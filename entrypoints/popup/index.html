<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manent</title>
    <style>
      body { min-width: 320px; font-family: sans-serif; }
      input[type='password'], input[type='text'], textarea, button {
        display: block; width: 100%; margin: 4px 0; box-sizing: border-box;
      }
      .error { color: red; }
      .spinner {
        width: 12px; height: 12px; border: 2px solid #333; border-top-color: transparent;
        border-radius: 50%; display: inline-block; vertical-align: middle;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      ul { padding-left: 16px; margin: 4px 0; }
      li { word-break: break-all; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <section id="login" hidden>
      <h2>Login</h2>
      <label for="login-key">Private key (nsec, hex or ncryptsec)</label>
      <input id="login-key" type="password" autocomplete="off" />
      <label for="login-password">Password (optional, encrypts the key)</label>
      <input id="login-password" type="password" autocomplete="off" />
      <button id="login-btn">Login</button>
      <button id="nip07-btn">Use signer extension (NIP-07)</button>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <section id="unlock" hidden>
      <h2>Unlock</h2>
      <label for="unlock-password">Password</label>
      <input id="unlock-password" type="password" autocomplete="off" />
      <button id="unlock-btn">Unlock</button>
      <p id="unlock-error" class="error" role="alert"></p>
    </section>

    <section id="main" hidden>
      <p id="tab-info"></p>
      <label for="comment">Comment (optional)</label>
      <textarea id="comment" rows="3"></textarea>
      <label><input type="checkbox" id="sensitive" /> Sensitive</label>
      <button id="save-btn">Save current page</button>
      <button id="save-article-btn">Save full article</button>
      <p role="status"><span id="save-spinner" class="spinner" hidden></span> <span id="save-status"></span></p>
      <hr />
      <h3>Recent saves</h3>
      <ul id="recent"></ul>
      <p id="pending-info"></p>
      <p><a id="manent-link" href="https://manent.dtonon.com" target="_blank">Open Manent</a></p>
      <hr />
      <h3>Relays</h3>
      <ul id="relays"></ul>
      <h3>Blossom servers</h3>
      <ul id="blossom"></ul>
      <hr />
      <p id="whoami"></p>
      <button id="logout-btn">Logout</button>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
